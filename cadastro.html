<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áureo - Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-custom position-relative py-4">

        <div class="lines-background">
            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div>
                <div class="line-side line-right"></div>
            </div>
            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div>
                <div class="line-side line-right"></div>
            </div>
        </div>

        <div class="card card-login p-4">
            <div class="card-body">

                <div class="mb-4 text-start">
                    <img src="assets/images/Logo/Áureo-gradiente ouro.png" alt="Logo Áureo" class="logo-img">
                </div>

                <h2 class="text-white fw-normal mb-1">Crie sua conta</h2>
                <p class="text-muted mb-4">Comece a dar controle à sua vida financeira</p>

                <form id="signupForm">
                    <div class="mb-3 text-start">
                        <label for="nome" class="form-label text-white fst-italic">Nome completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-dark text-white border-gold" id="nome" placeholder="Seu nome completo" required>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="email" class="form-label text-white fst-italic">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <img src="assets/images/Icones/mail.png" alt="" style="width:18px;height:18px;object-fit:contain;">
                            </span>
                            <input type="email" class="form-control bg-dark text-white border-gold" id="email" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="cpf" class="form-label text-white fst-italic">CPF</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <i class="bi bi-person-vcard"></i>
                            </span>
                            <input type="text" class="form-control bg-dark text-white border-gold" id="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <div class="mb-2 text-start">
                                <label for="password" class="form-label text-white fst-italic">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-gold text-muted">
                                        <img src="assets/images/Icones/lock.png" alt="" style="width:18px;height:18px;object-fit:contain;">
                                    </span>
                                    <input type="password" class="form-control bg-dark text-white border-gold" id="password" placeholder="Senha" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-2 text-start">
                                <label for="password2" class="form-label text-white fst-italic">Confirmar</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-gold text-muted">
                                        <img src="assets/images/Icones/lock.png" alt="" style="width:18px;height:18px;object-fit:contain;">
                                    </span>
                                    <input type="password" class="form-control bg-dark text-white border-gold" id="password2" placeholder="Repita" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="login-error text-start" id="signupError" role="alert" hidden></div>

                    <div class="form-check text-start mb-4 mt-2">
                        <input class="form-check-input" type="checkbox" id="termos" required>
                        <label class="form-check-label text-muted small" for="termos">
                            Aceito os <a href="#" class="link-gold">Termos de Uso</a> e a <a href="#" class="link-gold">Política de Privacidade</a>
                        </label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gold fw-bold">
                            <i class="bi bi-person-plus me-2"></i> Criar conta
                        </button>
                    </div>

                    <div class="mt-4 text-center">
                        <a href="index.html" class="text-muted text-decoration-none small">Já tem uma conta? <span class="text-gold-dark">Entrar</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const error = document.getElementById('signupError');
        const showError = msg => {
            error.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> ';
            error.append(msg);
            error.hidden = false;
        };

        form.addEventListener('input', () => { error.hidden = true; });

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const senha = document.getElementById('password').value;
            if (senha.length < 6) return showError('A senha precisa ter pelo menos 6 caracteres.');
            if (senha !== document.getElementById('password2').value) return showError('As senhas não conferem.');
            const ok = await aureoRegister(document.getElementById('nome').value, document.getElementById('email').value, senha);
            if (!ok) return showError('Este e-mail é reservado para o acesso de demonstração.');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
