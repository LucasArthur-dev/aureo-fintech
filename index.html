<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áureo - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-custom position-relative">
        
        <div class="lines-background">
            
            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div> 
                <div class="line-side line-right"></div>
            </div>

            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div> 
                <div class="line-side line-right"></div>
            </div>

        </div>
        <div class="card card-login p-4">
            <div class="card-body">
                
                <div class="mb-4 text-start">
                    <img src="assets/images/Logo/Áureo-gradiente ouro.png" alt="Logo Áureo" class="logo-img">
                </div>

                <h2 class="text-white fw-normal mb-1">Bem vindo ao Áureo</h2>
                <p class="text-muted mb-4">Controle sua vida financeira</p>

                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label text-white fst-italic">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <img src="assets/images/Icones/mail.png" alt="Icone Email" style="width: 18px; height: 18px; object-fit: contain;" class="input-icon">
                            </span>
                            <input type="email" class="form-control bg-dark text-white border-gold" id="email" placeholder="Insira seu e-mail">
                        </div>
                    </div>

                    <div class="mb-2 text-start">
                        <label for="password" class="form-label text-white fst-italic">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <img src="assets/images/Icones/lock.png" alt="Icone Senha" style="width: 18px; height: 18px; object-fit: contain;" class="input-icon">
                            </span>
                            <input type="password" class="form-control bg-dark text-white border-gold" id="password" placeholder="Insira sua senha">
                        </div>
                    </div>

                    <div class="text-start mb-4">
                        <a href="#" class="link-gold text-decoration-none small">Esqueci minha senha</a>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gold fw-bold">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                        </button>
                    </div>

                    <div class="mt-4 text-center">
                        <a href="cadastro.html" class="text-muted text-decoration-none small">Não tem uma conta? <span class="text-gold-dark">Cadastre-se!</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
