<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áureo - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-custom position-relative">
        
        <div class="lines-background">
            
            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div> 
                <div class="line-side line-right"></div>
            </div>

            <div class="line-row">
                <div class="line-side line-left"></div>
                <div class="line-spacer"></div> 
                <div class="line-side line-right"></div>
            </div>

        </div>
        <div class="card card-login p-4">
            <div class="card-body">
                
                <div class="mb-4 text-start">
                    <img src="assets/images/Logo/Áureo-gradiente ouro.png" alt="Logo Áureo" class="logo-img">
                </div>

                <h2 class="text-white fw-normal mb-1">Bem vindo ao Áureo</h2>
                <p class="text-muted mb-3">Controle sua vida financeira</p>

                <div class="demo-box mb-4">
                    <div class="d-flex align-items-center justify-content-between mb-1">
                        <span class="demo-title"><i class="bi bi-info-circle me-1"></i> Acesso de demonstração</span>
                        <button type="button" class="demo-fill" id="fillDemo">Preencher</button>
                    </div>
                    <div class="demo-cred">E-mail: <code>demo@aureo.com</code></div>
                    <div class="demo-cred">Senha: <code>aureo123</code></div>
                </div>

                <form id="loginForm" novalidate>
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label text-white fst-italic">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <img src="assets/images/Icones/mail.png" alt="Icone Email" style="width: 18px; height: 18px; object-fit: contain;" class="input-icon">
                            </span>
                            <input type="email" class="form-control bg-dark text-white border-gold" id="email" placeholder="Insira seu e-mail" autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-2 text-start">
                        <label for="password" class="form-label text-white fst-italic">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-gold text-muted">
                                <img src="assets/images/Icones/lock.png" alt="Icone Senha" style="width: 18px; height: 18px; object-fit: contain;" class="input-icon">
                            </span>
                            <input type="password" class="form-control bg-dark text-white border-gold" id="password" placeholder="Insira sua senha" autocomplete="current-password">
                        </div>
                    </div>

                    <div class="login-error text-start" id="loginError" role="alert" hidden>
                        <i class="bi bi-exclamation-circle me-1"></i> E-mail ou senha incorretos.
                    </div>

                    <div class="text-start mb-4">
                        <a href="#" class="link-gold text-decoration-none small">Esqueci minha senha</a>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gold fw-bold">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                        </button>
                    </div>

                    <div class="mt-4 text-center">
                        <a href="cadastro.html" class="text-muted text-decoration-none small">Não tem uma conta? <span class="text-gold-dark">Cadastre-se!</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const error = document.getElementById('loginError');

        document.getElementById('fillDemo').addEventListener('click', () => {
            email.value = AUREO_DEMO.email;
            password.value = AUREO_DEMO.senha;
            error.hidden = true;
        });

        [email, password].forEach(el => el.addEventListener('input', () => { error.hidden = true; }));

        form.addEventListener('submit', async e => {
            e.preventDefault();
            if (await aureoCheckLogin(email.value, password.value)) {
                window.location.href = 'dashboard.html';
            } else {
                error.hidden = false;
                form.classList.remove('shake');
                void form.offsetWidth;
                form.classList.add('shake');
            }
        });
    </script>
</body>
</html>
